org = "rust-lang"
name = "miri"
description = "An interpreter for Rust's mid-level intermediate representation"
# bors is only used for auxiliary functionality, like squashing
bots = ["bors", "rustbot"]

[access.teams]
compiler = "write"
miri = "write"

[[rulesets]]
pattern = "master"
ci-checks = ["conclusion"]
required-approvals = 0
merge-queue = { enabled = true }
