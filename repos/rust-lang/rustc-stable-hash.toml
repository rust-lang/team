org = "rust-lang"
name = "rustc-stable-hash"
description = "A stable hashing algorithm used by rustc: cross-platform, deterministic, not secure"
bots = []

[access.teams]
compiler = "write"

[[rulesets]]
pattern = "main"

[environments.publish]
tags = ["v*"]

[[crates-io]]
crates = ["rustc-stable-hash"]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["compiler"]
