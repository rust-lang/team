org = "rust-lang"
name = "ferris-says"
description = "A Rust flavored implementation of `cowsay`"
homepage = "https://crates.io/crates/ferris-says"
bots = []

[access.teams]
crate-maintainers = "maintain"

# The crates are not obsolete, but they are published very rarely, so
# for now we just track them, without providing a way to publish them.
[[crates-io]]
crates = [
    "ferris-says",
    "fsays",
]
