org = "rust-lang"
name = "stacker"
description = "Manual segmented stacks for Rust"
bots = []

[access.teams]
compiler = "write"

[environments.github-pages]

[environments.publish]
tags = [
    "psm-*",
    "stacker-*",
]

[[crates-io]]
crates = [
    "psm",
    "stacker",
]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["compiler"]
