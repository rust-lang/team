org = "rust-lang"
name = "dlmalloc-rs"
description = "dlmalloc ported into Rust"
bots = []

[access.teams]
compiler = "write"
libs = "write"

[[rulesets]]
pattern = "main"
required-approvals = 0

[environments.publish]
tags = ["*"]

[[crates-io]]
crates = ["dlmalloc"]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["compiler", "libs"]
