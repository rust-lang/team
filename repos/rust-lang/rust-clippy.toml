org = "rust-lang"
name = "rust-clippy"
description = "A bunch of lints to catch common mistakes and improve your Rust code. Book: https://doc.rust-lang.org/clippy/"
homepage = "https://clippy.rust-lang.org/"
# bors is only used for auxiliary functionality, like squashing and try builds
bots = ["bors", "rustbot"]

[pages]
build-type = "legacy"
branch = "gh-pages"
path = "/"

[access.teams]
clippy = "write"
clippy-contributors = "triage"
mods-venue = "triage"

[[rulesets]]
pattern = "main"
ci-checks = [
    "conclusion",
    "conclusion_dev",
    "conclusion_remark",
    "conclusion_changelog",
]
required-approvals = 0
merge-queue = { enabled = true }
allowed-merge-teams = ["clippy"]

# Required for running try builds created by bors.
# Must support force-pushes.
[[rulesets]]
pattern = "automation/bors/try"
bypass-apps = ["bors"]
prevent-update = true

# Required for running try builds created by bors.
# Must support force-pushes.
[[rulesets]]
pattern = "automation/bors/try-merge"
bypass-apps = ["bors"]
prevent-update = true

[environments.github-pages]

[environments.publish]
branches = ["main"]

[[crates-io]]
crates = ["clippy_utils"]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["clippy"]

# Obsolete crates
[[crates-io]]
crates = [
    "clippy",
    "clippy_config",
    "clippy_dummy",
    "clippy_lints",
    "clippy-mini-macro-test",
    "rustc_tools_util",
]
