org = "rust-lang"
name = "futures-rs"
description = "Zero-cost asynchronous programming in Rust"
homepage = "https://rust-lang.github.io/futures-rs/"
bots = ["rustbot"]

[pages]
build-type = "legacy"
branch = "gh-pages"
path = "/"

[access.teams]
wg-async = "write"

[[rulesets]]
pattern = "main"
required-approvals = 0

[[rulesets]]
pattern = "0.[1-9]"
required-approvals = 0

[environments.github-pages]

[[crates-io]]
crates = [
    "futures01",
    "futures-preview",
    "futures-async-runtime",
    "futures-async-runtime-preview",
    "futures-channel-preview",
    "futures-core-preview",
    "futures-cpupool",
    "futures-executor-preview",
    "futures-io-preview",
    "futures-join-macro-preview",
    "futures-macro-async",
    "futures-macro-async-preview",
    "futures-macro-await",
    "futures-macro-await-preview",
    "futures-select-macro-preview",
    "futures-sink-preview",
    "futures-stable-preview",
    "futures-test-preview",
    "futures-util-preview",
    "futures-stable",
]
