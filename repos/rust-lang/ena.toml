org = "rust-lang"
name = "ena"
description = "An implementation of union-find / congruence-closure in Rust. Extracted from rustc for independent experimentation."
bots = []

[access.teams]
compiler = "write"

[[rulesets]]
pattern = "main"

[environments.publish]
tags = ["*"]

[[crates-io]]
crates = ["ena"]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["compiler"]
