org = "rust-lang"
name = "rustc_apfloat"
description = "Rust port of C++ llvm::APFloat library"
bots = ["rustbot", "rfcbot"]

[access.teams]
compiler = "maintain"

[[rulesets]]
pattern = "main"
pr-required = false

[environments.publish]
branches = ["main"]

[[crates-io]]
crates = ["rustc_apfloat"]
publish-workflow = "publish.yaml"
publish-environment = "publish"
teams = ["compiler"]
