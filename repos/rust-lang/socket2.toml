org = 'rust-lang'
name = 'socket2'
description = 'Advanced configuration options for sockets.'
homepage = "https://docs.rs/socket2"
bots = []

[access.teams]
crate-maintainers = 'maintain'

[[rulesets]]
pattern = 'master'
ci-checks = [
    'Rustfmt',
    'Test (beta)',
    'Test (macos)',
    'Test (nightly)',
    'Test (stable)',
    'Test (windows)',
]

[environments.github-pages]

[[crates-io]]
# This crate is deprecated. It lives in the https://github.com/deprecrated/net2-rs repository,
# which is not tracked in team. Since socket2 is a spiritual successor of this crate, we track it
# here.
crates = ["net2"]
