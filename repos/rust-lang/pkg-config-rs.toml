org = "rust-lang"
name = "pkg-config-rs"
description = "Build library for invoking pkg-config for Rust"
homepage = "https://docs.rs/pkg-config"
bots = []

[pages]
build-type = "legacy"
branch = "gh-pages"
path = "/"

[access.teams]
crate-maintainers = "maintain"

[environments.github-pages]

[environments.publish]
tags = ["*"]

[[crates-io]]
crates = ["pkg-config"]
publish-workflow = "publish.yml"
publish-environment = "publish"
teams = ["crate-maintainers"]
