org = "rust-lang"
name = "rust-analyzer"
description = "A Rust compiler front-end for IDEs"
homepage = "https://rust-analyzer.github.io/"
bots = ["rustbot"]

[pages]
build-type = "legacy"
branch = "gh-pages"
path = "/"

[access.teams]
rust-analyzer = "write"
rust-analyzer-contributors = "triage"
cargo = "triage"
clippy = "triage"
compiler = "triage"
triage = "triage"

[[rulesets]]
pattern = "master"
ci-checks = ["conclusion"]
required-approvals = 0
merge-queue = { enabled = true }

[environments.github-pages]

[environments.publish-libs]
branches = ["master"]

# Library crates - dependencies of rust-analyzer that follow independent semantic versioning.
[[crates-io]]
crates = [
    "la-arena",
    "line-index",
    "lsp-server",
    "smol_str",
    "text-size",
    "ungrammar",
    "ungrammar2json"
]
publish-workflow = "publish-libs.yaml"
publish-environment = "publish-libs"
teams = ["rust-analyzer"]
